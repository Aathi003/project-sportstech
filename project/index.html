<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportstech - Home</title>
  <link class="tittlelogo" rel="icon" href="Adobe Express - file.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav>
      <!-- Logo and Desktop Navigation -->
      <div class="logo">
        <img src="Screenshot 2025-08-05 183504-Picsart-AiImageEnhancer.png" alt="SportsTech" class="tittlelogo">
      </div>

      <!-- Desktop Navigation -->
      <ul class="nav-links desktop-nav">
        <li><a href="#home">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <!-- Desktop Actions -->
      <div class="nav-actions desktop-actions">
        <input type="text" id="searchBar" placeholder="Search products...">
        <button class="wishlist-button" id="wishlistIcon">
          🤍 <span id="wishlistCount">0</span>
        </button>
        <button class="cart-button" id="cartIcon">
          🛒 <span id="cartCount">0</span>
        </button>
      </div>

      <!-- Mobile Actions (only cart and wishlist icons) -->
      <div class="nav-actions mobile-actions">
        <button class="wishlist-button mobile-icon" id="wishlistIconMobile">
           🤍<span id="wishlistCountMobile">0</span>
        </button>
        <button class="cart-button mobile-icon" id="cartIconMobile">
          🛒 <span id="cartCountMobile">0</span>
        </button>
      </div>

      <!-- Mobile Menu Toggle (on right side for mobile) -->
      <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>

    <!-- Mobile Sidebar -->
    <div class="mobile-sidebar" id="mobileSidebar">
      <div class="sidebar-header">
        <h3>Menu</h3>
        <button class="close-sidebar" id="closeSidebar">&times;</button>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-search">
          <input type="text" id="mobileSearchBar" placeholder="Search products...">
          <button class="search-btn">🔍</button>
        </div>

        <!-- Navigation Links -->
        <ul class="sidebar-nav">
          <li><a href="#home" onclick="closeMobileSidebar()">Home</a></li>
          <li><a href="product.html" onclick="closeMobileSidebar()"> Products</a></li>
          <li><a href="about.html" onclick="closeMobileSidebar()"> About</a></li>
          <li><a href="contact.html" onclick="closeMobileSidebar()"> Contact</a></li>
        </ul>

        <!-- Sidebar Actions -->
        <div class="sidebar-actions">
          <button class="sidebar-btn wishlist-sidebar-btn" id="wishlistSidebarBtn">
            <span class="btn-icon">🤍</span>
            <span class="btn-text">Wishlist</span>
            <span class="btn-count" id="wishlistCountSidebar">0</span>
          </button>

          <button class="sidebar-btn cart-sidebar-btn" id="cartSidebarBtn">
            <span class="btn-icon">🛒</span>
            <span class="btn-text">Cart</span>
            <span class="btn-count" id="cartCountSidebar">0</span>
          </button>

          <button class="sidebar-btn orders-btn">
            <span class="btn-icon">📋</span>
            <span class="btn-text">My Orders</span>
          </button>

          <button class="sidebar-btn profile-btn">
            <span class="btn-icon">👤</span>
            <span class="btn-text">Profile</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <img src="hero image 3.webp" alt="Hero" class="hero-image">
    <div class="hero-content">
      <h3>Welcome to SportsTech</h3>
      <p>Discover amazing sports technology products</p>
    </div>
  </section>

  

  <!-- Cart Popup -->
  <div id="cartPopup" class="hidden">
    <button class="close-cart-btn" onclick="closeCart()">&times;</button>
    <h3 class="cart-title">Your Cart</h3>
    <div id="cartItems"></div>
    <div class="cart-footer">
        <h4>Total: ₹<span id="cartTotal">0</span></h4>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Wishlist Popup -->
  <div id="wishlistPopup" class="hidden">
    <button class="close-wishlist-btn" onclick="closeWishlist()">&times;</button>
    <h3 class="wishlist-title">Your Wishlist</h3>
    <div id="wishlistItems"></div>
    <div class="wishlist-footer">
        <button class="clear-wishlist-btn" onclick="clearWishlist()">Clear Wishlist</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 SportsTech. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
